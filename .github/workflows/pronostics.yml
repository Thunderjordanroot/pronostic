name: Pronostics

on:
  schedule:
    - cron: "0 4 * * *"        # 04:00 UTC = 06:00 à Goma, chaque jour
  workflow_dispatch:
    inputs:
      mode:
        description: "Que veux-tu ?"
        type: choice
        default: aujourdhui
        options:
          - probe
          - aujourdhui
          - maintenant
          - creneau
      until:
        description: "Mode « maintenant » : heure limite (HH:MM)"
        default: "06:00"
      from_time:
        description: "Mode « creneau » : début (HH:MM)"
        default: "18:00"
      to_time:
        description: "Mode « creneau » : fin (HH:MM)"
        default: "23:59"

permissions:
  contents: write

concurrency:
  group: pronostics
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer le script (Football Charts)
        env:
          FC_API_KEY: ${{ secrets.FC_API_KEY }}
          TZ_LOCAL: Africa/Lubumbashi
          MODE: ${{ github.event.inputs.mode }}
          UNTIL: ${{ github.event.inputs.until }}
          FROM_T: ${{ github.event.inputs.from_time }}
          TO_T: ${{ github.event.inputs.to_time }}
        run: |
          if [ "$MODE" = "probe" ]; then
            python fc_picks.py probe
            exit 0
          fi
          python fc_picks.py update
          case "$MODE" in
            maintenant) python fc_picks.py picks --now --until "$UNTIL" ;;
            creneau)    python fc_picks.py picks --from "$FROM_T" --to "$TO_T" ;;
            *)          python fc_picks.py picks ;;
          esac
          python fc_picks.py export
          python fc_picks.py dashboard

      - name: Enregistrer les résultats
        if: ${{ github.event.inputs.mode != 'probe' }}
        run: |
          mkdir -p data docs
          git config user.name "pronostics-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Mise à jour $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
