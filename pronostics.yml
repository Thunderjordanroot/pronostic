name: Pronostics

on:
  schedule:
    - cron: "0 4 * * *"        # 04:00 UTC = 06:00 à Goma, chaque jour
  workflow_dispatch:
    inputs:
      mode:
        description: "Que veux-tu ?"
        type: choice
        default: aujourdhui
        options:
          - aujourdhui
          - maintenant
          - creneau
      until:
        description: "Mode « maintenant » : heure limite (HH:MM)"
        default: "06:00"
      from_time:
        description: "Mode « creneau » : début (HH:MM)"
        default: "18:00"
      to_time:
        description: "Mode « creneau » : fin (HH:MM)"
        default: "23:59"

permissions:
  contents: write

concurrency:
  group: pronostics
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer le script
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TZ_LOCAL: Africa/Lubumbashi
          MODE: ${{ github.event.inputs.mode }}
          UNTIL: ${{ github.event.inputs.until }}
          FROM_T: ${{ github.event.inputs.from_time }}
          TO_T: ${{ github.event.inputs.to_time }}
        run: |
          python safe_picks.py update
          case "$MODE" in
            maintenant) python safe_picks.py picks --now --until "$UNTIL" ;;
            creneau)    python safe_picks.py picks --from "$FROM_T" --to "$TO_T" ;;
            *)          python safe_picks.py picks ;;
          esac
          python safe_picks.py export
          python safe_picks.py dashboard

      - name: Enregistrer les résultats
        run: |
          git config user.name "pronostics-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Mise à jour $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
